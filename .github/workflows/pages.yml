# Sinh HTML từ noi-dung/*.md rồi đăng GitHub Pages — mỗi lần push lên main.
# Build có dòng ⚠ (ảnh thiếu, link hỏng, bài chưa vào mục lục) thì dừng, web giữ bản cũ.
name: Đăng cẩm nang

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
